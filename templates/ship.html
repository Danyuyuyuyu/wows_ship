<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    .card { width: 640px; padding: 28px; border-radius: 18px; background: #142335; color: #eef4fa; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h1 { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 44px; line-height: 1.2; overflow-wrap: anywhere; }
    .source { flex: 0 0 auto; max-width: 210px; padding: 7px 11px; border-radius: 10px; background: #203b54; color: #c9d8e7; font-size: 17px; line-height: 1.3; text-align: right; white-space: nowrap; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
    .meta span { padding: 6px 12px; border-radius: 999px; background: #203b54; color: #e5edf5; font-size: 22px; line-height: 1.25; }
    .image { display: flex; align-items: center; justify-content: center; height: 260px; margin-top: 20px; padding: 22px; border-radius: 14px; background: linear-gradient(145deg, #203b54, #172d43); }
    .image img, .image canvas { display: block; width: 100%; max-width: 100%; height: 100%; max-height: 100%; object-fit: contain; }
    .image img.contour, .image canvas.contour { filter: brightness(0) invert(1); }
    .notice { margin: 16px 0 0; color: #b8c8d8; font-size: 18px; line-height: 1.45; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <article class="card">
    <div class="header">
      <h1>{{ name }}</h1>
      <div class="source">{{ source_label }}</div>
    </div>
    <div class="meta">
      <span>{{ tier_label }}</span>
      <span>{{ type_label }}</span>
      <span>{{ nation_label }}</span>
    </div>
    {% if image_data_uri %}<div class="image"><img class="{% if image_is_contour %}contour{% endif %}" src="{{ image_data_uri }}" alt="舰船图"></div>{% endif %}
    {% if cache_notice %}<p class="notice">{{ cache_notice }}</p>{% endif %}
  </article>
</body>
</html>
